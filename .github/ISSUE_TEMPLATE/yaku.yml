name: 大意の誤り
description: 大意の誤りや、よりよい大意を知らせる
title: "[訳] 夏目漱石 詩篇（『漱石全集 第十二卷 初期の文章及詩歌俳句』より） "
labels: ["訳"]
body:
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "行頭にある ID（例: natsume-soseki-46afd591-000001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの大意
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した大意
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
